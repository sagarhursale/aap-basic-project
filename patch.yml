---
- name: Ubuntu Patch and Reboot
  hosts: patch_targets
  become: true
  serial: 1

  tasks:

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade Ubuntu packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Reboot target server
      ansible.builtin.reboot:
        reboot_timeout: 300
        connect_timeout: 10
        pre_reboot_delay: 5
        post_reboot_delay: 10
        test_command: uptime

    - name: Check server after reboot
      ansible.builtin.command: uptime
      register: uptime_result
      changed_when: false

    - name: Display uptime
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is UP: {{ uptime_result.stdout }}"
