---
- name: Ubuntu Patch and Reboot
  hosts: patch_targets
  become: true
  serial: 1

  tasks:

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade Ubuntu packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Reboot target server
      ansible.builtin.reboot:
        reboot_timeout: 900
        post_reboot_delay: 30

    - name: Check server after reboot
      ansible.builtin.command: uptime
      register: uptime_result
      changed_when: false

    - name: Display uptime
      ansible.builtin.debug:
        msg: "{{ uptime_result.stdout }}"
